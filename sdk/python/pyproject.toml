[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardenlabs-hmac"
version = "0.1.0"
description = "Cross-language HMAC-SHA256 request signing with a defined canonical string format."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "HardenLabs" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]
httpx = ["httpx>=0.24.0"]
requests = ["requests>=2.28"]
dotenv = ["python-dotenv>=1.0.0"]
all = ["fastapi>=0.100.0", "starlette>=0.27.0", "httpx>=0.24.0", "requests>=2.28", "python-dotenv>=1.0.0"]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
    "requests>=2.28",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pytest-asyncio>=0.21.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hardenlabs_hmac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
